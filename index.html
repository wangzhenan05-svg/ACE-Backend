<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- 左側邊欄 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo-area">
        <svg class="logo-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
        </svg>
        <span>Aura</span>
      </div>
      <button class="icon-btn" id="sidebar-close-btn" aria-label="關閉邊欄">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <!-- 主要功能選單 -->
    <div class="nav-list">
      <div class="nav-item">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <span>新對話</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>搜尋對話</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        <span>媒體庫</span>
      </div>
    </div>

    <div class="history-title">近期對話</div>
    <div class="history-list" id="history-container">
      <!-- 歷史對話列表 -->
    </div>

    <!-- 底部使用者與設定按鈕 -->
    <div class="sidebar-footer">
      <div class="user-info" id="user-profile-btn" title="切換帳戶">
        <div class="avatar">王</div>
        <span>王者楠</span>
      </div>
      <button class="icon-btn" id="settings-btn" title="設定">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>

      <!-- 帳戶切換彈出選單 -->
      <div class="account-popover" id="account-popover">
        <div class="account-header">切換帳戶</div>
        <div class="account-item active-account">
          <div class="avatar">王</div>
          <div class="account-details">
            <div class="name">王者楠</div>
            <div class="email">wangzhenan@example.com</div>
          </div>
        </div>
        <div class="account-item">
          <div class="avatar alt">J</div>
          <div class="account-details">
            <div class="name">James Wang</div>
            <div class="email">james.wang@example.com</div>
          </div>
        </div>
        <div class="account-action">新增其他帳戶</div>
      </div>

      <!-- 設定彈出視窗 -->
      <div class="settings-popover" id="settings-popover">
        <div class="popover-item">活動紀錄</div>
        <div class="popover-item">個人化智慧服務</div>
        <div class="popover-item">將個人化記憶匯入 Aura</div>
        <div class="popover-item">用量限制</div>
        <div class="popover-item">Gems 擴充模組</div>
        <div class="popover-item">你的公開連結</div>
        <div class="divider"></div>
        <div class="location-info">
          <div class="location-dot">• 香港</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 主內容區 -->
  <div class="main-content">
    <div class="top-header">
      <button class="icon-btn" id="menu-toggle-btn" aria-label="切換選單">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
    </div>

    <div class="chat-container" id="chat-container">
      <div class="welcome-title">王者楠，今天想聊點什麼？</div>
    </div>

    <div class="input-wrapper">
      <!-- 「+」號浮動選單 -->
      <div class="plus-popover" id="plus-popover">
        <div class="sub-menu">
          <div class="sub-btn">相簿</div>
          <div class="sub-btn">相機</div>
          <div class="sub-btn">檔案</div>
        </div>
        <div class="popover-menu">
          <div class="menu-row">建立圖像</div>
          <div class="menu-row">創作音樂</div>
          <div class="menu-row">Canvas</div>
          <div class="menu-row">引導式學習</div>
        </div>
      </div>

      <div class="input-box">
        <button class="icon-btn" id="plus-btn">+</button>
        <input type="text" id="user-input" placeholder="輸入訊息...">
        <button class="icon-btn" aria-label="語音輸入">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        <!-- 新增的發送按鈕（紙飛機） -->
        <button class="icon-btn send-btn" id="send-btn" aria-label="發送訊息">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
